<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0b2e">
<title>LaySRT Cosmos | CapCut JSON → SRT</title>
<style>
* { box-sizing: border-box; }

:root {
    --bg-deep: #0a0118;
    --bg-purple: #1a0b2e;
    --card: rgba(20, 10, 40, 0.85);
    --card-inner: #0d0520;
    --border-outer: #2a2a3e;
    --text: #f0e8ff;
    --text-muted: #a89bc4;
    --primary: #a855f7;
    --primary-hover: #c084fc;
    --primary-glow: rgba(168, 85, 247, 0.4);
    --success: #4ade80;
    --danger: #f87171;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    padding: 20px;
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    background-color: var(--bg-deep);
    background-image:
        radial-gradient(1px 1px at 5% 10%, #ffffff, transparent),
        radial-gradient(1px 1px at 15% 25%, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 25% 5%, #ffffff, transparent),
        radial-gradient(1px 1px at 35% 45%, #e0d0ff, transparent),
        radial-gradient(1px 1px at 45% 15%, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 55% 35%, #ffffff, transparent),
        radial-gradient(1px 1px at 65% 60%, #e0d0ff, transparent),
        radial-gradient(1px 1px at 75% 20%, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 85% 50%, #ffffff, transparent),
        radial-gradient(1px 1px at 95% 30%, #e0d0ff, transparent),
        radial-gradient(1px 1px at 10% 65%, #ffffff, transparent),
        radial-gradient(1px 1px at 22% 80%, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 40% 90%, #e0d0ff, transparent),
        radial-gradient(1px 1px at 55% 75%, #ffffff, transparent),
        radial-gradient(1px 1px at 70% 95%, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 82% 72%, #e0d0ff, transparent),
        radial-gradient(1px 1px at 92% 88%, #ffffff, transparent),
        radial-gradient(1px 1px at 30% 55%, #ffffff, transparent),
        radial-gradient(1px 1px at 60% 5%, #ffffff, transparent),
        radial-gradient(1px 1px at 48% 68%, #e0d0ff, transparent),
        radial-gradient(ellipse at 20% 0%, rgba(124, 58, 237, 0.35) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(168, 85, 247, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(45, 27, 78, 0.6) 0%, transparent 70%),
        linear-gradient(180deg, #0a0118 0%, #1a0b2e 50%, #0a0118 100%);
    background-attachment: fixed;
    background-repeat: no-repeat;
}

.app-container {
    max-width: 1000px;
    margin: 0 auto;
}

header {
    text-align: center;
    margin-bottom: 24px;
    padding: 20px;
}

header h1 {
    margin: 0 0 8px;
    font-size: clamp(26px, 4vw, 36px);
    background: linear-gradient(135deg, #c084fc, #a855f7, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 800;
    letter-spacing: -0.5px;
    filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.5));
}

header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
}

.main-stack {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.frame {
    border: 3px solid var(--border-outer);
    border-radius: 20px;
    padding: 8px;
    background: linear-gradient(135deg, rgba(42, 42, 62, 0.9), rgba(26, 26, 46, 0.9));
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    position: relative;
}

.frame::before {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), transparent 40%);
    pointer-events: none;
}

.frame-inner {
    background: var(--card);
    border-radius: 14px;
    padding: 22px;
    border: 1px solid #1a1a2e;
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 1;
}

.frame-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 14px;
    padding: 6px 14px;
    background: rgba(168, 85, 247, 0.1);
    border: 1px solid rgba(168, 85, 247, 0.3);
    border-radius: 20px;
    box-shadow: 0 0 20px var(--primary-glow);
}

.frame-label .num {
    background: var(--primary);
    color: #fff;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
}

.drop-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px dashed rgba(168, 85, 247, 0.4);
    border-radius: 14px;
    padding: 38px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    background: rgba(168, 85, 247, 0.03);
    min-height: 160px;
}

.drop-zone:hover, .drop-zone.dragover {
    border-color: var(--primary);
    background: rgba(168, 85, 247, 0.1);
    box-shadow: 0 0 30px var(--primary-glow);
    transform: translateY(-2px);
}

.drop-icon { font-size: 38px; margin-bottom: 10px; }
.drop-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.drop-subtitle { color: var(--text-muted); font-size: 13px; }

#fileInput { display: none; }

.file-info {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    padding: 12px;
    background: rgba(168, 85, 247, 0.08);
    border-radius: 10px;
    border: 1px solid rgba(168, 85, 247, 0.2);
}

.file-icon { font-size: 20px; }
.file-name { font-weight: 600; font-size: 13px; word-break: break-all; }
.file-size { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

.actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    font-family: inherit;
}

.btn-primary {
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    color: #fff;
    box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
}

.btn-primary:hover:not(:disabled) {
    background: linear-gradient(135deg, #c084fc, #a855f7);
    box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6);
    transform: translateY(-1px);
}

.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-secondary {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border: 1px solid var(--border-outer);
}

.btn-secondary:hover { background: rgba(255,255,255,0.12); }

.hidden { display: none !important; }

.status {
    margin-top: 14px;
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
}

.status.success { background: rgba(74, 222, 128, 0.1); color: var(--success); border: 1px solid rgba(74, 222, 128, 0.3); }
.status.error { background: rgba(248, 113, 113, 0.1); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.3); }

.stats {
    display: flex;
    gap: 10px;
    margin-top: 16px;
}

.stat {
    flex: 1;
    text-align: center;
    padding: 14px;
    background: rgba(168, 85, 247, 0.06);
    border-radius: 12px;
    border: 1px solid rgba(168, 85, 247, 0.2);
}

.stat-number {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, #c084fc, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.stat-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.preview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
}

.preview-meta { color: var(--text-muted); font-size: 12px; }

.copy-btn {
    background: rgba(168, 85, 247, 0.15);
    border: 1px solid rgba(168, 85, 247, 0.4);
    color: var(--primary-hover);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}

.copy-btn:hover {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 0 20px var(--primary-glow);
}

.preview-box {
    background: var(--card-inner);
    border: 1px solid rgba(168, 85, 247, 0.15);
    border-radius: 12px;
    padding: 18px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    line-height: 1.7;
    color: #d8d0e8;
    max-height: 600px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: inset 0 0 40px rgba(168, 85, 247, 0.05);
}

.preview-box::-webkit-scrollbar { width: 18px; }
.preview-box::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.4);
    border-radius: 10px;
    margin: 6px 0;
}
.preview-box::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #7c3aed, #a855f7);
    border-radius: 10px;
    border: 3px solid var(--card-inner);
    min-height: 50px;
    box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
}
.preview-box::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, #a855f7, #c084fc);
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.9);
}

.srt-line-num { color: #7c3aed; font-weight: 700; }
.srt-time { color: #a855f7; font-weight: 600; }
.srt-text { color: #e0d8f0; }

.empty-msg {
    color: var(--text-muted);
    font-style: italic;
    text-align: center;
    padding: 40px 20px;
    font-family: -apple-system, sans-serif;
}

.empty-msg .icon {
    display: block;
    font-size: 42px;
    margin-bottom: 12px;
    opacity: 0.5;
}

.footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 30px 0 10px;
    opacity: 0.7;
}

@media (max-width: 600px) {
    .actions { flex-direction: column; }
    .btn { width: 100%; }
    .frame-inner { padding: 16px; }
    .preview-box { max-height: 450px; font-size: 12px; }
    .preview-box::-webkit-scrollbar { width: 14px; }
}
</style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🌌 LaySRT Cosmos</h1>
        <p>Chuyển file JSON CapCut thành phụ đề SRT chuẩn xác</p>
    </header>

    <div class="main-stack">
        <!-- KHUNG 1: TẢI FILE -->
        <div class="frame">
            <div class="frame-inner">
                <div class="frame-label"><span class="num">1</span> Tải file CapCut JSON</div>

                <label class="drop-zone" id="dropZone" for="fileInput" tabindex="0">
                    <div class="drop-icon">🌠</div>
                    <div class="drop-title">Kéo thả file JSON vào đây</div>
                    <div class="drop-subtitle">hoặc chạm để chọn file — hỗ trợ draft_content.json</div>
                </label>

                <input type="file" id="fileInput" accept=".json,application/json,text/json,text/plain,*/*">

                <div id="fileInfo" class="file-info hidden">
                    <div class="file-icon">📄</div>
                    <div>
                        <div id="fileName" class="file-name"></div>
                        <div id="fileSize" class="file-size"></div>
                    </div>
                </div>

                <div class="actions">
                    <label class="btn btn-primary" for="fileInput">📁 Chọn file JSON</label>
                    <button id="convertBtn" type="button" class="btn btn-primary" disabled>⚙️ Chuyển sang SRT</button>
                    <button id="resetBtn" type="button" class="btn btn-secondary hidden">🔄 Làm lại</button>
                </div>

                <div id="status" class="status hidden"></div>

                <div id="stats" class="stats hidden">
                    <div class="stat">
                        <div id="subtitleCount" class="stat-number">0</div>
                        <div class="stat-label">Dòng phụ đề</div>
                    </div>
                    <div class="stat">
                        <div id="durationInfo" class="stat-number">00:00</div>
                        <div class="stat-label">Thời lượng</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- KHUNG 2: XEM TRƯỚC SRT -->
        <div class="frame">
            <div class="frame-inner">
                <div class="frame-label"><span class="num">2</span> Xem trước file SRT</div>

                <div class="preview-header">
                    <div id="previewMeta" class="preview-meta">Chưa có dữ liệu</div>
                    <button id="copyBtn" class="copy-btn hidden" onclick="copySRT()">📋 Copy toàn bộ</button>
                </div>

                <div id="preview" class="preview-box">
                    <div class="empty-msg">
                        <span class="icon">✨</span>
                        Chưa có dữ liệu. Hãy tải file JSON lên để xem trước phụ đề...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">Made with 💜 — LaySRT Cosmos</div>
</div>

<script>
let subtitles = [];
let fullSRT = "";

const fileInput   = document.getElementById('fileInput');
const dropZone    = document.getElementById('dropZone');
const fileInfo    = document.getElementById('fileInfo');
const fileName    = document.getElementById('fileName');
const fileSize    = document.getElementById('fileSize');
const convertBtn  = document.getElementById('convertBtn');
const resetBtn    = document.getElementById('resetBtn');
const statusBox   = document.getElementById('status');
const statsBox    = document.getElementById('stats');
const previewBox  = document.getElementById('preview');
const previewMeta = document.getElementById('previewMeta');
const copyBtn     = document.getElementById('copyBtn');
const subtitleCount = document.getElementById('subtitleCount');
const durationInfo  = document.getElementById('durationInfo');

fileInput.addEventListener('change', e => {
    if (e.target.files.length) handleFile(e.target.files[0]);
});

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
    if (!file) return;
    resetUI(false);

    fileName.textContent = file.name;
    fileSize.textContent = formatFileSize(file.size);
    fileInfo.classList.remove('hidden');

    const reader = new FileReader();
    reader.onload = ev => {
        try {
            let content = ev.target.result.replace(/^\uFEFF/, '').trim();
            if (!content) throw new Error("File JSON đang trống.");
            
            const data = JSON.parse(content);
            const result = [];
            const seen = new Set();
            
            // Sử dụng thuật toán trích xuất chuẩn xác của bạn
            extractSubs(data, result, seen);
            result.sort((a, b) => a.startMs - b.startMs);
            
            subtitles = result;

            if (!subtitles.length) {
                showStatus('Không tìm thấy phụ đề trong file JSON này.', 'error');
                convertBtn.disabled = true;
                return;
            }

            showStatus(`Đã đọc ${subtitles.length} dòng phụ đề. Nhấn "Chuyển sang SRT" để tải về.`, 'success');
            updateStats(subtitles);
            
            fullSRT = subtitlesToSrt(subtitles);
            renderFullPreview(subtitles);
            
            convertBtn.disabled = false;
            resetBtn.classList.remove('hidden');
            copyBtn.classList.remove('hidden');
        } catch (err) {
            showStatus('File JSON không hợp lệ: ' + err.message, 'error');
            convertBtn.disabled = true;
        }
    };
    reader.onerror = () => showStatus('Không đọc được file.', 'error');
    reader.readAsText(file, 'utf-8');
}

/* =========================================================
   THUẬT TOÁN TRÍCH XUẤT TỪ FILE JSON GỐC CỦA BẠN
========================================================= */
function parseMaybeJSON(value) {
    let result = value;
    for (let i = 0; i < 4; i++) {
        if (typeof result !== 'string') break;
        const text = result.trim();
        if (!text) return null;
        try { result = JSON.parse(text); } catch { break; }
    }
    return result;
}

function getWordText(words, index) {
    if (Array.isArray(words?.text)) return String(words.text[index] ?? '').trim();
    return '';
}

function extractWordTiming(words) {
    let startMs = null, endMs = null;
    if (words && Array.isArray(words.start_time) && Array.isArray(words.end_time)) {
        const count = Math.max(words.start_time.length, words.end_time.length);
        for (let i = 0; i < count; i++) {
            const text = getWordText(words, i);
            const start = Number(words.start_time[i]);
            if (text && Number.isFinite(start)) { startMs = start; break; }
        }
        for (let i = count - 1; i >= 0; i--) {
            const text = getWordText(words, i);
            const end = Number(words.end_time[i]);
            if (text && Number.isFinite(end)) { endMs = end; break; }
        }
    }
    if (Array.isArray(words)) {
        for (const word of words) {
            if (!word || typeof word !== 'object') continue;
            const text = String(word.text ?? '').trim();
            const start = Number(word.start_time);
            if (text && Number.isFinite(start)) { startMs = start; break; }
        }
        for (let i = words.length - 1; i >= 0; i--) {
            const word = words[i];
            if (!word || typeof word !== 'object') continue;
            const text = String(word.text ?? '').trim();
            const end = Number(word.end_time);
            if (text && Number.isFinite(end)) { endMs = end; break; }
        }
    }
    return { startMs, endMs };
}

function addSubtitle(result, seen, text, startMs, endMs) {
    text = String(text ?? '').trim();
    if (!text) return;
    startMs = Number(startMs); endMs = Number(endMs);
    if (!Number.isFinite(startMs)) startMs = 0;
    if (!Number.isFinite(endMs)) endMs = 0;
    if (endMs <= startMs) endMs = startMs + 1;

    const key = Math.round(startMs) + '|' + Math.round(endMs) + '|' + text;
    if (seen.has(key)) return;
    seen.add(key);
    result.push({ text, startMs, endMs });
}

function processSentence(sentence, result, seen) {
    if (!sentence || typeof sentence !== 'object') return;
    const text = String(sentence.text ?? '').trim();
    if (!text) return;

    let startMs = Number(sentence.start_time);
    let endMs = Number(sentence.end_time);
    if (!Number.isFinite(startMs)) startMs = 0;
    if (!Number.isFinite(endMs)) endMs = 0;

    if (sentence.words !== undefined) {
        const timing = extractWordTiming(sentence.words);
        if (timing.startMs !== null) startMs = timing.startMs;
        if (timing.endMs !== null) endMs = timing.endMs;
    }
    addSubtitle(result, seen, text, startMs, endMs);
}

function extractSubs(obj, result, seen) {
    if (!obj || typeof obj !== 'object') return;

    if (Object.prototype.hasOwnProperty.call(obj, 'subtitle_cache_info')) {
        const cache = parseMaybeJSON(obj.subtitle_cache_info);
        if (cache && typeof cache === 'object' && Array.isArray(cache.sentence_list)) {
            for (const sentence of cache.sentence_list) {
                processSentence(sentence, result, seen);
            }
        }
    }

    if (Array.isArray(obj)) {
        for (const item of obj) extractSubs(item, result, seen);
    } else {
        for (const value of Object.values(obj)) {
            if (value && typeof value === 'object') extractSubs(value, result, seen);
        }
    }
}

/* =========================================================
   XỬ LÝ THỜI GIAN VÀ TẠO SRT
========================================================= */
function msToSrtTime(ms) {
    ms = Number(ms);
    if (!Number.isFinite(ms)) ms = 0;
    ms = Math.max(0, Math.round(ms));
    const hours = Math.floor(ms / 3600000);
    const minutes = Math.floor((ms % 3600000) / 60000);
    const seconds = Math.floor((ms % 60000) / 1000);
    const millis = ms % 1000;
    return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0') + ',' + String(millis).padStart(3, '0');
}

function normalizeSubText(text) {
    return String(text == null ? '' : text)
        .replace(/\r\n?/g, '\n')
        .split('\n')
        .map(line => line.trimEnd())
        .filter(line => line.trim() !== '')
        .join('\n')
        .trim();
}

function subtitlesToSrt(list) {
    const out = new Array(list.length);
    for (let i = 0; i < list.length; i++) {
        const item = list[i];
        out[i] = (i + 1) + '\r\n' + msToSrtTime(item.startMs) + ' --> ' + msToSrtTime(item.endMs) + '\r\n' + normalizeSubText(item.text).replace(/\n/g, '\r\n') + '\r\n\r\n';
    }
    return out.join('');
}

/* =========================================================
   GIAO DIỆN XEM TRƯỚC
========================================================= */
function renderFullPreview(subs) {
    const html = subs.map((sub, i) => {
        const num = `<span class="srt-line-num">${i + 1}</span>`;
        const time = `<span class="srt-time">${msToSrtTime(sub.startMs)} --&gt; ${msToSrtTime(sub.endMs)}</span>`;
        const text = `<span class="srt-text">${escapeHtml(sub.text)}</span>`;
        return `${num}\n${time}\n${text}`;
    }).join('\n\n');

    previewBox.innerHTML = html;
    previewMeta.textContent = `Tổng cộng ${subs.length} dòng phụ đề`;
}

function escapeHtml(text) {
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* =========================================================
   TẢI FILE VÀ RESET
========================================================= */
convertBtn.addEventListener('click', () => {
    if (!subtitles.length) return;
    const baseName = (fileName.textContent || 'draft_content').replace(/\.json$/i, '');
    downloadFile(fullSRT, baseName + '.srt');
    showStatus(`✅ Đã tạo file ${baseName}.srt với ${subtitles.length} dòng phụ đề.`, 'success');
});

function downloadFile(content, filename) {
    const blob = new Blob(['\uFEFF' + content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function copySRT() {
    if (!fullSRT) return;
    navigator.clipboard.writeText(fullSRT).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✅ Đã copy!';
        setTimeout(() => { copyBtn.textContent = originalText; }, 2000);
    }).catch(err => alert('Không thể copy: ' + err));
}

resetBtn.addEventListener('click', () => resetUI(true));

function resetUI(clearFileInput) {
    subtitles = [];
    fullSRT = "";
    convertBtn.disabled = true;
    statusBox.classList.add('hidden');
    statsBox.classList.add('hidden');
    fileInfo.classList.add('hidden');
    resetBtn.classList.add('hidden');
    copyBtn.classList.add('hidden');
    previewMeta.textContent = 'Chưa có dữ liệu';
    previewBox.innerHTML = `<div class="empty-msg"><span class="icon">✨</span>Chưa có dữ liệu. Hãy tải file JSON lên để xem trước phụ đề...</div>`;
    if (clearFileInput) fileInput.value = '';
}

function showStatus(msg, type) {
    statusBox.textContent = msg;
    statusBox.className = 'status ' + type;
    statusBox.classList.remove('hidden');
}

function updateStats(subs) {
    subtitleCount.textContent = subs.length;
    const totalMs = subs.reduce((max, s) => Math.max(max, s.endMs), 0);
    durationInfo.textContent = msToSrtTime(totalMs).slice(0, 5);
    statsBox.classList.remove('hidden');
}

function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}
</script>
