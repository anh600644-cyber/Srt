<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>LaySRT Pro | CapCut JSON → SRT</title>
<style>
* { box-sizing: border-box; }

:root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --primary: #10b981;
    --primary-hover: #059669;
    --border: #334155;
    --danger: #ef4444;
    --warning: #f59e0b;
}

body {
    margin: 0;
    padding: 20px;
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
}

.app-container {
    max-width: 1200px;
    margin: 0 auto;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    margin: 0 0 8px;
    font-size: clamp(24px, 4vw, 32px);
    background: linear-gradient(135deg, #10b981, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
}

header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
}

/* Bố cục 2 cột */
.main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
}

@media (max-width: 900px) {
    .main-grid {
        grid-template-columns: 1fr;
    }
}

.card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.card-title {
    margin: 0 0 16px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
}

.step {
    background: var(--primary);
    color: #fff;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
}

.drop-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(255,255,255,0.02);
    min-height: 180px;
}

.drop-zone:hover, .drop-zone.dragover {
    border-color: var(--primary);
    background: rgba(16, 185, 129, 0.05);
}

.drop-icon {
    font-size: 36px;
    margin-bottom: 12px;
}

.drop-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
}

.drop-subtitle {
    color: var(--text-muted);
    font-size: 13px;
}

#fileInput { display: none; }

.file-info {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
    padding: 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    border: 1px solid var(--border);
}

.file-icon { font-size: 20px; }
.file-name { font-weight: 600; font-size: 13px; word-break: break-all; }
.file-size { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

.actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    font-family: inherit;
}

.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-secondary:hover { background: var(--card-hover); }
.btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
.btn-danger:hover { background: rgba(239, 68, 68, 0.2); }

.hidden { display: none !important; }

.status {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    display: flex;
    align-items: center;
    gap: 8px;
}

.status.success { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
.status.error { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }

.stats {
    display: flex;
    gap: 10px;
    margin-top: 16px;
}

.stat {
    flex: 1;
    text-align: center;
    padding: 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    border: 1px solid var(--border);
}

.stat-number {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
}

.stat-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Khung xem trước SRT */
.preview-box {
    background: #020617;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #e2e8f0;
    max-height: 500px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
}

.preview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
}

.preview-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
}

.copy-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}

.copy-btn:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}

.footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 30px 0 10px;
}
</style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🎬 LaySRT Pro</h1>
        <p>Chuyển file JSON CapCut thành phụ đề SRT chuẩn xác. Không quảng cáo, không theo dõi.</p>
    </header>

    <div class="main-grid">
        <!-- CỘT TRÁI: TẢI FILE VÀ CẤU HÌNH -->
        <div class="left-column">
            <section class="card">
                <h2 class="card-title"><span class="step">1</span> Chọn file CapCut JSON</h2>

                <label class="drop-zone" id="dropZone" for="fileInput" tabindex="0">
                    <div class="drop-icon">📂</div>
                    <div class="drop-title">Kéo thả file JSON vào đây</div>
                    <div class="drop-subtitle">hoặc chạm để chọn file<br>Hỗ trợ draft_content.json</div>
                </label>

                <input type="file" id="fileInput" accept=".json,application/json,text/json,text/plain,*/*">

                <div id="fileInfo" class="file-info hidden">
                    <div class="file-icon">📄</div>
                    <div>
                        <div id="fileName" class="file-name"></div>
                        <div id="fileSize" class="file-size"></div>
                    </div>
                </div>

                <div class="actions">
                    <label class="btn btn-primary" for="fileInput">📁 Chọn file JSON</label>
                    <button id="convertBtn" type="button" class="btn btn-primary" disabled>⚙️ Xuất file SRT</button>
                    <button id="resetBtn" type="button" class="btn btn-secondary hidden">🔄 Làm lại</button>
                </div>

                <div id="status" class="status hidden"></div>

                <div id="stats" class="stats hidden">
                    <div class="stat">
                        <div id="subtitleCount" class="stat-number">0</div>
                        <div class="stat-label">Dòng phụ đề</div>
                    </div>
                    <div class="stat">
                        <div id="durationInfo" class="stat-number">00:00</div>
                        <div class="stat-label">Thời lượng</div>
                    </div>
                </div>
            </section>
        </div>

        <!-- CỘT PHẢI: XEM TRƯỚC SRT -->
        <div class="right-column">
            <section class="card">
                <div class="preview-header">
                    <div class="preview-title">👁️ Xem trước file SRT</div>
                    <button id="copyBtn" class="copy-btn hidden" onclick="copySRT()">📋 Copy toàn bộ</button>
                </div>
                <div id="preview" class="preview-box">
                    <span style="color: var(--text-muted); font-style: italic;">Chưa có dữ liệu. Hãy tải file JSON lên để xem trước...</span>
                </div>
            </section>
        </div>
    </div>

    <div class="footer">Made with ❤️ — LaySRT Pro</div>
</div>

<script>
/* ============ BIẾN TOÀN CỤC ============ */
let capcutData = null;
let subtitles = [];
let fullSRT = "";

/* ============ DOM ============ */
const fileInput   = document.getElementById('fileInput');
const dropZone    = document.getElementById('dropZone');
const fileInfo    = document.getElementById('fileInfo');
const fileName    = document.getElementById('fileName');
const fileSize    = document.getElementById('fileSize');
const convertBtn  = document.getElementById('convertBtn');
const resetBtn    = document.getElementById('resetBtn');
const statusBox   = document.getElementById('status');
const statsBox    = document.getElementById('stats');
const previewBox  = document.getElementById('preview');
const copyBtn     = document.getElementById('copyBtn');
const subtitleCount = document.getElementById('subtitleCount');
const durationInfo  = document.getElementById('durationInfo');

/* ============ SỰ KIỆN CHỌN FILE ============ */
fileInput.addEventListener('change', e => {
    if (e.target.files.length) handleFile(e.target.files[0]);
});

dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

/* ============ ĐỌC FILE ============ */
function handleFile(file) {
    if (!file) return;
    resetUI(false);

    fileName.textContent = file.name;
    fileSize.textContent = formatFileSize(file.size);
    fileInfo.classList.remove('hidden');

    const reader = new FileReader();
    reader.onload = ev => {
        try {
            capcutData = JSON.parse(ev.target.result);
            subtitles = extractSubtitles(capcutData);

            if (!subtitles.length) {
                showStatus('Không tìm thấy phụ đề trong file JSON này. Hãy chắc chắn đây là file draft_content.json của CapCut.', 'error');
                convertBtn.disabled = true;
                return;
            }

            showStatus(`Đã đọc ${subtitles.length} dòng phụ đề. Nhấn "Xuất file SRT" để tải về.`, 'success');
            updateStats(subtitles);
            
            // Tạo sẵn SRT và hiển thị lên khung xem trước
            fullSRT = generateSRT(subtitles);
            updatePreview(fullSRT);
            
            convertBtn.disabled = false;
            resetBtn.classList.remove('hidden');
            copyBtn.classList.remove('hidden');
        } catch (err) {
            showStatus('File JSON không hợp lệ: ' + err.message, 'error');
            convertBtn.disabled = true;
        }
    };
    reader.onerror = () => showStatus('Không đọc được file.', 'error');
    reader.readAsText(file, 'utf-8');
}

/* ============ TRÍCH XUẤT PHỤ ĐỀ TỪ CAPCUT JSON ============ */
function extractSubtitles(data) {
    const results = [];
    const textMap = {};

    // 1. Lưu tất cả nội dung chữ vào một Map theo ID
    if (data.materials && Array.isArray(data.materials.texts)) {
        data.materials.texts.forEach(t => {
            const content = extractTextContent(t);
            if (content) {
                textMap[t.id] = content;
            }
        });
    }

    // 2. Quét qua các tracks để lấy thời gian và liên kết với chữ
    if (Array.isArray(data.tracks)) {
        data.tracks.forEach(track => {
            // Chỉ xử lý các track chứa chữ (text hoặc subtitle)
            if ((track.type === 'text' || track.type === 'subtitle') && Array.isArray(track.segments)) {
                track.segments.forEach(seg => {
                    const content = textMap[seg.material_id];
                    if (!content) return;

                    // CapCut lưu thời gian bằng micro-giây
                    let start = 0;
                    let duration = 0;

                    if (seg.target_timerange) {
                        start = Number(seg.target_timerange.start || 0);
                        duration = Number(seg.target_timerange.duration || 0);
                    } else if (seg.source_timerange) {
                        start = Number(seg.source_timerange.start || 0);
                        duration = Number(seg.source_timerange.duration || 0);
                    }

                    // Chuyển từ micro-giây sang mili-giây, làm tròn để khớp với file gốc
                    const startMs = Math.round(start / 1000);
                    const durationMs = Math.round(duration / 1000);

                    results.push({
                        start: startMs,
                        end: startMs + durationMs,
                        content: content
                    });
                });
            }
        });
    }

    // 3. Dự phòng cho các file JSON cũ hoặc cấu trúc khác
    if (results.length === 0 && data.materials && Array.isArray(data.materials.texts)) {
        data.materials.texts.forEach(t => {
            const content = extractTextContent(t);
            if (!content) return;
            const start = Math.round(Number(t.start || 0) / 1000);
            const duration = Math.round(Number(t.duration || 0) / 1000);
            results.push({ start, end: start + duration, content });
        });
    }

    // Sắp xếp theo thời gian bắt đầu
    results.sort((a, b) => a.start - b.start);

    // Lọc bỏ các dòng rỗng
    return results.filter(r => r.content && r.content.trim() !== '');
}

function extractTextContent(item) {
    if (item.content) {
        if (typeof item.content === 'string') {
            const trimmed = item.content.trim();
            if (trimmed.startsWith('{')) {
                try {
                    const parsed = JSON.parse(trimmed);
                    if (parsed.text) return String(parsed.text).trim();
                } catch (e) { /* không phải JSON */ }
            }
            return trimmed;
        }
        if (typeof item.content === 'object' && item.content.text) {
            return String(item.content.text).trim();
        }
    }
    if (item.text) return String(item.text).trim();
    if (item.words && Array.isArray(item.words)) {
        return item.words.map(w => w.text || w.word || '').join('').trim();
    }
    return '';
}

/* ============ TẠO SRT ============ */
function generateSRT(subs) {
    let srt = '';
    subs.forEach((sub, i) => {
        srt += (i + 1) + '\n';
        srt += formatTime(sub.start) + ' --> ' + formatTime(sub.end) + '\n';
        srt += sub.content + '\n\n';
    });
    return srt;
}

function formatTime(ms) {
    if (ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    const h  = String(Math.floor(totalSec / 3600)).padStart(2, '0');
    const m  = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
    const s  = String(totalSec % 60).padStart(2, '0');
    const msPart = String(ms % 1000).padStart(3, '0');
    return `${h}:${m}:${s},${msPart}`;
}

/* ============ CẬP NHẬT GIAO DIỆN XEM TRƯỚC ============ */
function updatePreview(srtContent) {
    // Hiển thị 20 dòng đầu để tránh lag trình duyệt
    const lines = srtContent.split('\n');
    const previewText = lines.slice(0, 60).join('\n');
    const suffix = lines.length > 60 ? '\n\n... (còn rất nhiều dòng nữa, hãy bấm Xuất file SRT để tải toàn bộ)' : '';
    
    previewBox.innerHTML = `<span style="color:#34d399;">${escapeHtml(previewText)}</span>${suffix ? `<span style="color:var(--text-muted);">${escapeHtml(suffix)}</span>` : ''}`;
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ============ NÚT XUẤT SRT ============ */
convertBtn.addEventListener('click', () => {
    if (!subtitles.length) return;

    const baseName = (fileName.textContent || 'draft_content').replace(/\.json$/i, '');
    downloadFile(fullSRT, baseName + '.srt');

    showStatus(`✅ Đã tạo file ${baseName}.srt với ${subtitles.length} dòng phụ đề.`, 'success');
});

function downloadFile(content, filename) {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ============ NÚT COPY ============ */
function copySRT() {
    if (!fullSRT) return;
    navigator.clipboard.writeText(fullSRT).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✅ Đã copy!';
        copyBtn.style.background = 'var(--primary)';
        copyBtn.style.color = '#fff';
        setTimeout(() => {
            copyBtn.textContent = originalText;
            copyBtn.style.background = '';
            copyBtn.style.color = '';
        }, 2000);
    }).catch(err => {
        alert('Không thể copy: ' + err);
    });
}

/* ============ NÚT LÀM LẠI ============ */
resetBtn.addEventListener('click', () => {
    resetUI(true);
});

function resetUI(clearFileInput) {
    capcutData = null;
    subtitles = [];
    fullSRT = "";
    convertBtn.disabled = true;
    statusBox.classList.add('hidden');
    statsBox.classList.add('hidden');
    fileInfo.classList.add('hidden');
    resetBtn.classList.add('hidden');
    copyBtn.classList.add('hidden');
    previewBox.innerHTML = '<span style="color: var(--text-muted); font-style: italic;">Chưa có dữ liệu. Hãy tải file JSON lên để xem trước...</span>';
    if (clearFileInput) {
        fileInput.value = '';
    }
}

/* ============ HIỂN THỊ ============ */
function showStatus(msg, type) {
    statusBox.textContent = msg;
    statusBox.className = 'status ' + type;
    statusBox.classList.remove('hidden');
}

function updateStats(subs) {
    subtitleCount.textContent = subs.length;
    const totalMs = subs.reduce((max, s) => Math.max(max, s.end), 0);
    durationInfo.textContent = formatDuration(totalMs);
    statsBox.classList.remove('hidden');
}

function formatDuration(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}
</script>
</body>
</html>
